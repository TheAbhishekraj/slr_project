# Venue card: Elsevier
format_id = elsevier
display_name = Elsevier elsarticle
template_class = elsarticle
template_opt = preprint
compile_engine = pdflatex
bib_engine = bibtex
bib_style = elsarticle-num
paper = letter
margins_in = 1.0 1.0 1.0 1.0
columns = 1
gutter_in = 0.25
body_font_pt = 11
body_font_fam = times
title_pt = 17
title_case = title
author_pt = 11
abstract_pt = 10
abstract_style = bold_italic
abstract_words = 150-250
keywords_pt = 9
keywords_style = bold_italic
keywords_max = 6
keywords_order = alphabetical
h1_style = small_caps_centered
h1_number = arabic
h2_style = italic_left
h2_number = Alpha
h3_style = italic_runin
h3_number = arabic_paren
fig_caption_pos = below
fig_caption_pt = 9
fig_label_fmt = Fig. {n}.
tbl_caption_pos = above
tbl_caption_pt = 9
tbl_caption_sc = false
tbl_label_fmt = Table {n}.
eq_number_align = right
eq_number_fmt = ({n})
cite_style = author_year
cite_run_min = 3
cite_sep = ", "
ref_pt = 9
ref_indent = hanging
page_numbers = true
headers = false
footers = false
